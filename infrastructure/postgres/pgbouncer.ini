[databases]
test-devscaffolding_db = host=postgres port=5432 dbname=test-devscaffolding_db

[pgbouncer]
; Connection pooling mode
; transaction: Server is released back to pool after transaction finishes
; session: Server is released back to pool after client disconnects
; statement: Server is released back to pool after query finishes
pool_mode = session

; Listen on all interfaces
listen_addr = 0.0.0.0
listen_port = 6432

; Authentication
auth_type = md5
auth_file = /etc/pgbouncer/userlist.txt

; Connection limits
max_client_conn = 100
default_pool_size = 20
min_pool_size = 5
reserve_pool_size = 5
reserve_pool_timeout = 3

; Connection timeouts (in seconds)
server_lifetime = 3600
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15

; Query timeouts (in seconds)
query_timeout = 0
query_wait_timeout = 120
client_idle_timeout = 0
idle_transaction_timeout = 0

; Logging
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60

; Performance tuning
max_prepared_statements = 0
pkt_buf = 4096
listen_backlog = 128
sbuf_loopcnt = 5

; Admin console
admin_users = test-devscaffolding_user
stats_users = test-devscaffolding_user

; Disable DNS lookups for better performance
dns_max_ttl = 15
dns_zone_check_period = 0

; TCP settings
tcp_keepalive = 1
tcp_keepcnt = 5
tcp_keepidle = 30
tcp_keepintvl = 10

; TLS/SSL settings (disabled by default, enable for production)
;client_tls_sslmode = disable
;server_tls_sslmode = disable

; Dangerous timeouts (set to 0 to disable)
; These can cause issues if set too low
server_check_delay = 30
server_check_query = SELECT 1
server_fast_close = 0

; Application name support
application_name_add_host = 1

; Verbose logging (disable in production)
verbose = 0

; Ignore startup parameters that are not supported in transaction pooling mode
ignore_startup_parameters = extra_float_digits,options

; Server reset query (important for transaction pooling)
; This ensures clean state between transactions
server_reset_query = DISCARD ALL
server_reset_query_always = 0

; Autodb feature (disabled)
; When enabled, allows connecting to any database
;* = host=postgres port=5432

[users]
; User definitions are typically managed via environment variables
; or the auth_file (userlist.txt)
